<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="shortcut icon" href="logo.jpeg" type="image/x-icon">
</head>
<body>
  <div class="app-shell">
    <div class="calculator-card">
      <header class="top-bar">
        <div>
          <p class="title">Modern Calculator</p>
          <p class="subtitle">Light / Dark mode + live time</p>
        </div>
        <button id="themeToggle" class="mode-btn" aria-label="Toggle theme">Dark Mode</button>
      </header>

      <div class="display-panel">
        <div class="time-display" id="timeDisplay">00:00:00</div>
        <div class="result-display" id="resultDisplay">0</div>
      </div>

      <section class="history-panel">
        <div class="history-header">
          <h2>History</h2>
          <button id="clearHistory" class="history-clear">Clear History</button>
        </div>
        <div class="history-list" id="historyList">
          <div class="history-empty">No history yet. Calculate something to save it.</div>
        </div>
      </section>

      <div class="button-grid">
        <button class="btn accent" data-action="clear">C</button>
        <button class="btn accent" data-action="delete">DEL</button>
        <button class="btn accent" data-action="percent">%</button>
        <button class="btn operator" data-value="/">÷</button>

        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn operator" data-value="*">×</button>

        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn operator" data-value="-">−</button>

        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn operator" data-value="+">+</button>

        <button class="btn" data-value="0">0</button>
        <button class="btn" data-value=".">.</button>
        <button class="btn" data-value="(">(</button>
        <button class="btn" data-value=")">)</button>

        <button class="btn wide accent" data-action="equals">=</button>
      </div>
    </div>

    <footer class="app-footer">
      <p class="footer-note">Use this app to calculate quickly, switch themes, and track time while you work.</p>
      <div class="social-links">
        <a href="#" class="social-link">Twitter</a>
        <a href="#" class="social-link">Instagram</a>
        <a href="#" class="social-link">LinkedIn</a>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
